name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, lint, content and types
        run: npm run check

      - name: Build static site
        run: npm run build

      # Chromium only. The suite asserts routing, metadata, accessibility and
      # progressive enhancement — none of which is engine-specific — so paying
      # for three browser downloads on every run would buy nothing.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e
